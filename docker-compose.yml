services:
  hardhat-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/contracts-deployed"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  ipfs-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: ./.env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      hardhat-node:
        condition: service_healthy
